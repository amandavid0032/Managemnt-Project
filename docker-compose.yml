# Local development stack: PostgreSQL + the EduHub API.
#
# The legacy Express service and the CRA frontend are intentionally not here.
# The frontend dev server does not belong in a container image (it is served
# by `npm start` during development and built to static assets for deployment),
# and the legacy backend is being retired.

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-eduhub_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, so it never starts against a database that is
      # still initialising.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eduhub} -d ${POSTGRES_DB:-eduhub_dev}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: eduhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eduhub_dev}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-4000}:4000'
    # Migrations run at start-up rather than at build time: a built image must
    # be deployable against any database, and `migrate deploy` never generates
    # or resets — it only applies committed migrations.
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  postgres-data:
